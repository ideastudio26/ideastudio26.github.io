<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDEA STUDIO - الاستوديو الرسمي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080F1A; --card:#121C2A; --card2:#1A2636; --border:#1E324A;
  --blue:#0A84FF; --blue2:#00BFFF; --blue-dark:#0666CC;
  --grad:linear-gradient(135deg,#0A84FF 0%,#00C6FF 100%);
  --grad-hover:linear-gradient(135deg,#00BFFF 0%,#0A84FF 100%);
  --green:#22c55e; --green-glow:rgba(34,197,94,0.4);
  --text:#FFFFFF; --muted:#7A8FA8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;direction:rtl;overflow-x:hidden}

/* Top bar like Mustafa Gamerz screenshot */
.topbar{max-width:1320px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:100;background:rgba(8,15,26,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.top-left{display:flex;gap:10px}
.icon-btn{width:46px;height:46px;background:var(--card);border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px;cursor:pointer;transition:.2s}
.icon-btn:hover{border-color:var(--blue);color:var(--text)}
.top-right{display:flex;align-items:center;gap:12px}
.top-right h1{font-size:18px;font-weight:800;letter-spacing:0.5px}
.logo-box{width:48px;height:48px;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.logo-box img{width:100%;height:100%;object-fit:cover}

/* Hero Banner - EXACT like screenshot */
.hero{max-width:1320px;margin:16px auto;padding:0 16px}
.hero-inner{background: radial-gradient(120% 120% at 15% 20%, rgba(10,132,255,0.18), transparent), radial-gradient(100% 100% at 85% 10%, rgba(0,191,255,0.14), transparent), linear-gradient(180deg,#121C2A 0%,#0D1726 100%); border:1px solid var(--border); border-radius:28px; padding:52px 20px; text-align:center; position:relative; overflow:hidden}
.hero-inner h2{font-size:54px;font-weight:900;line-height:1;letter-spacing:-1px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.hero-inner h2 .white{color:#fff}
.hero-inner h2 .grad{background:linear-gradient(90deg,#fff 0%, var(--blue) 50%, #00E5FF 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text}
@media(max-width:600px){.hero-inner h2{font-size:36px;gap:10px} .hero-inner{padding:36px 16px;border-radius:22px} }

/* Search - dark like screenshot */
.search-wrap{max-width:1320px;margin:18px auto;padding:0 16px}
.search-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px 20px;display:flex;align-items:center;gap:12px;transition:.2s}
.search-box:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(10,132,255,0.15)}
.search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'Cairo';font-size:15px}
.search-box input::placeholder{color:var(--muted)}
.search-icon{color:var(--muted);font-size:20px;flex-shrink:0}

/* Filter row - EXACT like screenshot: المفضلة + الترتيب الافتراضي */
.filter-row{max-width:1320px;margin:16px auto;padding:0 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn-fav{background:var(--card);border:1px solid var(--border);color:var(--text);padding:14px 22px;border-radius:16px;font-family:'Cairo';font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.2s}
.btn-fav.active{border-color:var(--green);background:rgba(34,197,94,0.1)}
.btn-sort{background:var(--card);border:1px solid var(--border);color:var(--text);padding:14px 20px;border-radius:16px;font-family:'Cairo';font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;margin-right:auto}
.btn-cat{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:12px 18px;border-radius:14px;font-family:'Cairo';font-size:13px;font-weight:600;cursor:pointer}
.btn-cat.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Grid - 2 columns like screenshot */
.main{max-width:1320px;margin:0 auto;padding:12px 16px 100px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:480px){.grid{gap:12px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(4,1fr)}}

/* Card - EXACT like Mustafa Gamerz screenshots */
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;overflow:hidden;position:relative;transition:.25s}
.card:hover{transform:translateY(-4px);border-color:rgba(10,132,255,0.4);box-shadow:0 12px 32px rgba(0,0,0,0.4)}
.card-img{position:relative;aspect-ratio:4/3;overflow:hidden;background:#0A1420;border-radius:22px 22px 0 0}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .card-img img{transform:scale(1.06)}
.badge-new{position:absolute;top:12px;right:12px;background:var(--green);color:#fff;font-size:12px;font-weight:800;padding:6px 14px;border-radius:10px;z-index:2;box-shadow:0 4px 16px var(--green-glow)}
.card-title{padding:14px 12px 12px;font-size:13px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);min-height:44px}
.card-actions{padding:0 12px 14px;display:flex;gap:8px;align-items:center}
.heart-btn{width:46px;height:46px;background:var(--card2);border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:20px;flex-shrink:0;transition:.2s}
.heart-btn:hover{border-color:var(--blue);color:var(--blue)}
.heart-btn.liked{background:rgba(255,59,59,0.12);border-color:#ff3b3b;color:#ff3b3b}
.dl-btn{flex:1;background:var(--grad);border:none;color:#fff;padding:13px;border-radius:14px;font-family:'Cairo';font-size:14px;font-weight:800;cursor:pointer;transition:.2s;box-shadow:0 4px 16px rgba(10,132,255,0.3)}
.dl-btn:hover{background:var(--grad-hover);transform:scale(1.02);box-shadow:0 6px 20px rgba(10,132,255,0.4)}

.no-results{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
.no-results h3{color:var(--text);margin-bottom:8px}
.footer{text-align:center;padding:30px 20px;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}
.fab{position:fixed;bottom:22px;left:22px;width:56px;height:56px;background:var(--grad);border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;box-shadow:0 8px 28px rgba(10,132,255,0.4);cursor:pointer;z-index:50;transition:.2s}
.fab:hover{transform:translateY(-2px)}
</style>
</head>

];

let favOnly = false;
let activeCat = 'all';
let searchQ = '';

function render(){
  const grid = document.getElementById('gamesGrid');
  let list = allGames.filter(g=>{
    const matchCat = activeCat==='all' || g.category===activeCat || (g.tags&&g.tags.includes(activeCat));
    const matchSearch = !searchQ || g.title.toLowerCase().includes(searchQ.toLowerCase());
    const matchFav = !favOnly || localStorage.getItem('fav_'+g.title);
    return matchCat && matchSearch && matchFav;
  });
  grid.innerHTML='';
  if(!list.length){ grid.innerHTML='<div class="no-results"><h3>ما لقينا لعبة 😕</h3><p>جرب اسم مختلف أو اختر تصنيف آخر</p></div>'; return; }
  list.forEach(g=>{
    const isFav = localStorage.getItem('fav_'+g.title);
    const card = document.createElement('div');
    card.className='card';
    card.innerHTML=`
      <div class="card-img">
        <div class="badge-new">جديد</div>
        <img src="${g.image}" alt="${g.title}" loading="lazy">
      </div>
      <div class="card-title">${g.title}</div>
      <div class="card-actions">
        <div class="heart-btn ${isFav?'liked':''}" onclick="toggleFav(this,'${g.title.replace(/'/g,"")}')">${isFav?'❤️':'♡'}</div>
        <button class="dl-btn" onclick="location.href='${g.link}'">تحميل</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

function toggleFav(btn,title){
  const key='fav_'+title;
  if(localStorage.getItem(key)){ localStorage.removeItem(key); btn.classList.remove('liked'); btn.innerHTML='♡'; }
  else { localStorage.setItem(key,'1'); btn.classList.add('liked'); btn.innerHTML='❤️'; }
}

fetch('games.json?v='+Date.now()).then(r=>r.json()).then(data=>{ if(data&&data.length) allGames=data; render(); }).catch(()=>render());
render();

document.getElementById('searchInput').addEventListener('input', e=>{ searchQ=e.target.value; render(); });
document.querySelectorAll('.btn-cat').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.btn-cat').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    activeCat=b.dataset.filter;
    render();
  });
});
document.getElementById('favBtn').addEventListener('click', function(){
  favOnly=!favOnly;
  this.classList.toggle('active', favOnly);
  render();
});
</script>
