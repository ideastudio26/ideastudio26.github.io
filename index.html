<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDEA STUDIO - الاستوديو الرسمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080F1A; --card:#121C2A; --card2:#1A2636; --border:#1E324A;
  --blue:#0A84FF;
  --grad:linear-gradient(135deg,#0A84FF 0%,#00C6FF 100%);
  --grad-hover:linear-gradient(135deg,#00BFFF 0%,#0A84FF 100%);
  --green:#22c55e; --green-glow:rgba(34,197,94,0.4);
  --text:#FFFFFF; --muted:#7A8FA8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;direction:rtl;overflow-x:hidden}
button,a,[role=button]{touch-action:manipulation}

/* Icons */
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}

/* Shared button feel */
.icon-btn,.btn-fav,.btn-sort,.btn-cat,.heart-btn,.dl-btn,.fab{transition:transform .15s,background .2s,border-color .2s,color .2s,box-shadow .2s}
.icon-btn:active,.btn-fav:active,.btn-sort:active,.btn-cat:active,.heart-btn:active,.dl-btn:active,.fab:active{transform:scale(.94)}

/* Top bar */
.topbar{max-width:1320px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:100;background:rgba(8,15,26,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.top-left{display:flex;gap:10px}
.icon-btn{width:46px;height:46px;background:var(--card);border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;text-decoration:none}
.icon-btn .ic{width:21px;height:21px}
.icon-btn:hover{border-color:var(--blue);color:var(--text)}
.icon-btn.tg:hover{color:#2AABEE}
.top-right{display:flex;align-items:center;gap:12px}
.top-right h1{font-size:18px;font-weight:800;letter-spacing:0.5px}
.logo-box{width:48px;height:48px;flex-shrink:0}
.logo-box img{display:block;width:100%;height:100%;object-fit:contain}

/* Banner */
.hero{max-width:1320px;margin:16px auto;padding:0 16px}
.hero img{display:block;width:100%;height:auto;aspect-ratio:5/2;object-fit:cover;border:1px solid var(--border);border-radius:28px;background:var(--card)}
@media(max-width:600px){.hero img{border-radius:22px}}

/* Search */
.search-wrap{max-width:1320px;margin:18px auto;padding:0 16px}
.search-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px 20px;display:flex;align-items:center;gap:12px;transition:border-color .2s,box-shadow .2s}
.search-box:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(10,132,255,0.15)}
.search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'Cairo';font-size:15px}
.search-box input::placeholder{color:var(--muted)}
.search-icon{display:flex;color:var(--muted);font-size:20px;flex-shrink:0}

/* Filters */
.filter-row{max-width:1320px;margin:16px auto;padding:0 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn-fav{background:var(--card);border:1px solid var(--border);color:var(--text);padding:14px 22px;border-radius:16px;font-family:'Cairo';font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
.btn-fav .ic{width:18px;height:18px;color:#ff3b3b}
.btn-fav.active{border-color:var(--green);background:rgba(34,197,94,0.1)}
.btn-fav.active .ic{fill:currentColor}
.btn-sort{background:var(--card);border:1px solid var(--border);color:var(--text);padding:14px 20px;border-radius:16px;font-family:'Cairo';font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;margin-right:auto}
.btn-sort .ic{width:15px;height:15px}
.btn-cat{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:12px 18px;border-radius:14px;font-family:'Cairo';font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn-cat .ic{width:17px;height:17px}
.btn-cat.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Grid */
.main{max-width:1320px;margin:0 auto;padding:12px 16px 100px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:480px){.grid{gap:12px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1200px){.grid{grid-template-columns:repeat(4,1fr)}}

/* Card */
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;overflow:hidden;position:relative;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);border-color:rgba(10,132,255,0.4);box-shadow:0 12px 32px rgba(0,0,0,0.4)}
.card-img{position:relative;aspect-ratio:4/3;overflow:hidden;background:#0A1420;border-radius:22px 22px 0 0}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .card-img img{transform:scale(1.06)}
.badge-new{position:absolute;top:12px;right:12px;background:var(--green);color:#fff;font-size:12px;font-weight:800;padding:6px 14px;border-radius:10px;z-index:2;box-shadow:0 4px 16px var(--green-glow)}
.card-title{padding:14px 12px 12px;font-size:13px;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:44px}
.card-actions{padding:0 12px 14px;display:flex;gap:8px;align-items:center}
.heart-btn{width:46px;height:46px;background:var(--card2);border:1px solid var(--border);border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex-shrink:0}
.heart-btn .ic{width:21px;height:21px}
.heart-btn:hover{border-color:var(--blue);color:var(--blue)}
.heart-btn.liked{background:rgba(255,59,59,0.12);border-color:#ff3b3b;color:#ff3b3b}
.heart-btn.liked .ic{fill:currentColor}
.dl-btn{flex:1;background:var(--grad);border:none;color:#fff;padding:13px;border-radius:14px;font-family:'Cairo';font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(10,132,255,0.3)}
.dl-btn:hover{background:var(--grad-hover);transform:scale(1.02);box-shadow:0 6px 20px rgba(10,132,255,0.4)}

.no-results{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
.no-results .ic{width:46px;height:46px;margin:0 auto 12px}
.no-results h3{color:var(--text);margin-bottom:8px}
.footer{text-align:center;padding:30px 20px;color:var(--muted);font-size:12px;border-top:1px solid var(--border)}
.fab{position:fixed;bottom:22px;left:22px;width:56px;height:56px;background:var(--grad);border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 28px rgba(10,132,255,0.4);cursor:pointer;z-index:50}
.fab .ic{width:24px;height:24px;stroke-width:2.6}
.fab:hover{transform:translateY(-2px)}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes heartPop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes imgIn{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
.topbar{animation:fadeDown .5s cubic-bezier(.22,.8,.3,1) backwards}
.hero img{animation:fadeUp .65s .08s cubic-bezier(.22,.8,.3,1) backwards}
.search-wrap{animation:fadeUp .55s .16s cubic-bezier(.22,.8,.3,1) backwards}
.filter-row{animation:fadeUp .55s .22s cubic-bezier(.22,.8,.3,1) backwards}
.footer{animation:fadeIn .8s .4s ease backwards}
.card{animation:fadeUp .5s cubic-bezier(.22,.8,.3,1) backwards;animation-delay:calc(var(--i,0)*55ms)}
.card-img img{animation:imgIn .6s ease backwards;animation-delay:calc(var(--i,0)*55ms + 80ms)}
.no-results{animation:fadeUp .4s ease backwards}
.heart-btn.pop .ic{animation:heartPop .38s ease}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* Copy / long-press protection (search box stays usable) */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{pointer-events:none;-webkit-user-drag:none}
input{-webkit-user-select:text;user-select:text}
</style>
</head>

let allGames = [
  {title:"IDEA Runner - لعبتنا الأولى", image:PLACEHOLDER, category:"ألعاب", tags:["جديد","ألعاب"], link:"#"},
  {title:"IDEA Notes - تطبيق الملاحظات", image:PLACEHOLDER, category:"تطبيقات", tags:["جديد","تطبيقات"], link:"#"},
  {title:"PUBG Mobile - نسخة IDEA", image:PLACEHOLDER, category:"ألعاب", tags:["ألعاب"], link:"#"},
  {title:"Life Is Strange - إصدار IDEA", image:PLACEHOLDER, category:"ألعاب", tags:["ألعاب"], link:"#"}
];

let favOnly = false, activeCat = 'all', searchQ = '', visible = [];
const grid = document.getElementById('gamesGrid');
const favs = new Set();
try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf('fav_')===0) favs.add(k.slice(4)); } }catch(e){}

const favKey = t => String(t).replace(/'/g,'');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico = n => '<svg class="ic" aria-hidden="true"><use href="#i-'+n+'"/></svg>';

/* Empty-state text depends on where the user is */
function emptyMsg(){
  const q = esc(searchQ.trim());
  const where = favOnly ? ' في مفضلتك' : (activeCat==='ألعاب' ? ' في الألعاب' : (activeCat==='تطبيقات' ? ' في التطبيقات' : ''));
  if(q) return ['search','ما لقينا نتيجة لـ «'+q+'»'+where,'تأكد من الكتابة أو جرّب كلمة ثانية'];
  if(favOnly) return ['heart','مفضلتك فاضية','اضغط على القلب في أي بطاقة وبتنضاف هون'];
  if(activeCat==='ألعاب') return ['game','ما في ألعاب حالياً','قريباً بنضيف ألعاب جديدة، تابعنا على تيليجرام'];
  if(activeCat==='تطبيقات') return ['phone','ما في تطبيقات حالياً','قريباً بنضيف تطبيقات جديدة، تابعنا على تيليجرام'];
  return ['frown','ما في شي للعرض حالياً','ارجع بعد شوي'];
}

function render(){
  const q = searchQ.trim().toLowerCase();
  visible = allGames.filter(g =>
    (activeCat==='all' || g.category===activeCat || (g.tags && g.tags.includes(activeCat))) &&
    (!q || String(g.title).toLowerCase().includes(q)) &&
    (!favOnly || favs.has(favKey(g.title)))
  );
  if(!visible.length){
    const m = emptyMsg();
    grid.innerHTML = '<div class="no-results">'+ico(m[0])+'<h3>'+m[1]+'</h3><p>'+m[2]+'</p></div>';
    return;
  }
  grid.innerHTML = visible.map((g,i) => {
    const t = esc(g.title), img = String(g.image).replace(/"/g,'&quot;');
    return '<div class="card" style="--i:'+Math.min(i,12)+'">'
      + '<div class="card-img"><div class="badge-new">جديد</div><img src="'+img+'" alt="'+t+'" loading="lazy" decoding="async"></div>'
      + '<div class="card-title">'+t+'</div>'
      + '<div class="card-actions">'
      + '<div class="heart-btn'+(favs.has(favKey(g.title))?' liked':'')+'" data-act="fav" data-i="'+i+'" role="button" aria-label="مفضلة">'+ico('heart')+'</div>'
      + '<button class="dl-btn" data-act="dl" data-i="'+i+'">تحميل</button>'
      + '</div></div>';
  }).join('');
}

/* One click listener for all cards */
grid.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const g = visible[+el.dataset.i]; if(!g) return;
  if(el.dataset.act==='fav'){
    const k = favKey(g.title), on = !favs.has(k);
    if(on) favs.add(k); else favs.delete(k);
    try{ if(on) localStorage.setItem('fav_'+k,'1'); else localStorage.removeItem('fav_'+k); }catch(_){}
    el.classList.toggle('liked', on);
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  }else if(g.link && g.link!=='#'){
    location.href = g.link;
  }
});

/* Load games.json (revalidated, re-render only if it changed) */
fetch('games.json',{cache:'no-cache'})
  .then(r => r.ok ? r.json() : null)
  .then(data => {
    if(Array.isArray(data) && data.length && JSON.stringify(data)!==JSON.stringify(allGames)){ allGames = data; render(); }
  }).catch(()=>{});
render();

let timer;
document.getElementById('searchInput').addEventListener('input', e => {
  searchQ = e.target.value; clearTimeout(timer); timer = setTimeout(render,120);
});
document.querySelectorAll('.btn-cat').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.btn-cat').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); activeCat = b.dataset.filter; render();
}));
document.getElementById('favBtn').addEventListener('click', function(){
  favOnly = !favOnly; this.classList.toggle('active', favOnly); render();
});

/* Block copy / long-press / context menu (search box stays usable) */
(function(){
  const inField = t => { const el = t && t.nodeType===3 ? t.parentElement : t; return !!(el && el.closest && el.closest('input')); };
  ['contextmenu','selectstart','copy','cut','dragstart'].forEach(ev =>
    document.addEventListener(ev, e => { if(!inField(e.target)) e.preventDefault(); }, true));
  document.addEventListener('keydown', e => {
    if(!(e.ctrlKey || e.metaKey)) return;
    const k = (e.key||'').toLowerCase();
    if(['s','u','p'].includes(k) || (['c','x','a'].includes(k) && !inField(e.target))) e.preventDefault();
  }, true);
})();
</script>
