<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDEA STUDIO - الاستوديو الرسمي - ألعابنا وتطبيقاتنا الأصلية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080F1A;
  --card:#121C2A;
  --card-hover:#192636;
  --border:#1E2F45;
  --blue:#0A84FF;
  --blue-dark:#0666CC;
  --blue-glow:rgba(10,132,255,0.35);
  --text:#FFFFFF;
  --muted:#8AA0B8;
  --green:#22c55e;
  --green-dark:#16a34a;
  --green-glow:rgba(34,197,94,0.45);
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0} body{background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none} img{max-width:100%;display:block}
.header-wrap{position:sticky;top:0;z-index:100;background:rgba(7,5,26,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.header{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px} .logo-img{width:42px;height:42px;border-radius:12px;background:#0F0B2E;border:1px solid var(--border)}
.logo-text h1{font-size:18px;font-weight:800;white-space:nowrap;display:flex;gap:6px} .logo-text h1 span{color:var(--blue)} .logo-text p{font-size:10px;color:var(--muted);white-space:nowrap}
.nav{display:flex;gap:12px;font-size:12px;font-weight:600;flex-wrap:wrap} .nav a{color:var(--muted)} .nav a.active,.nav a:hover{color:var(--text)}
.controls{max-width:1320px;margin:20px auto 10px;padding:0 16px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.search-box{flex:1;min-width:220px;max-width:420px;position:relative} .search-box input{width:100%;background:var(--card);border:1px solid var(--border);color:#fff;padding:11px 42px 11px 16px;border-radius:999px;outline:none;font-family:'Cairo';font-size:13px} .search-box input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-glow)} .search-box .icon{position:absolute;right:14px;top:50%;transform:translateY(-50%)}
.filters{display:flex;gap:8px;flex-wrap:wrap} .filters button{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer;font-family:'Cairo';font-size:11px;font-weight:600} .filters button.active{background:linear-gradient(90deg,var(--cyan),var(--purple));color:#fff;border-color:transparent;box-shadow:0 4px 16px var(--blue-glow)}
.main{max-width:1320px;margin:0 auto;padding:12px 16px 80px} .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px} @media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}} @media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}} @media(max-width:480px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:.25s} .card:hover{transform:translateY(-5px);border-color:var(--blue);box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 20px var(--blue-glow)}
.card-img{position:relative;aspect-ratio:4/3;background:#0F0B2E;overflow:hidden} .card-img img{width:100%;height:100%;object-fit:cover} .badge{position:absolute;top:8px;right:8px;background:var(--green);color:#fff;font-size:10px;font-weight:800;padding:4px 10px;border-radius:999px;box-shadow:0 4px 12px var(--green-glow)} .dl{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;padding:4px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.1)}
.card-body{padding:12px} .card-title{font-size:13px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.pills{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap} .pill{background:#1E2D4A;border:1px solid #2A3E68;color:#A9C4FF;font-size:9px;padding:3px 8px;border-radius:6px} .pill.apk{background:linear-gradient(90deg,var(--cyan),var(--purple));border-color:transparent;color:#fff;box-shadow:0 2px 8px var(--blue-glow)}
.no-results{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)} .no-results h3{color:#fff;margin-bottom:6px}
.footer{border-top:1px solid var(--border);padding:28px 16px;text-align:center;color:var(--muted);font-size:11px}
</style>
</head>

async function loadGames(){
  try{ const r=await fetch('games.json'); allGames=await r.json(); render(allGames); }
  catch(e){ document.getElementById('grid').innerHTML='<div class=no-results><h3>لم يتم إنشاء ونشر تطبيقات بعد 😕</h3><p>نحن نعمل على أولى ألعابنا الرسمية - ترقبوا الإطلاق قريباً!</p></div>'; }
}
function render(list){
  const grid=document.getElementById('grid');
  if(list.length==0){ grid.innerHTML='<div class=no-results><h3>لم يتم إنشاء ونشر تطبيقات بعد 😕</h3><p>نحن نعمل على أولى ألعابنا وتطبيقاتنا الرسمية - قريباً</p></div>'; return; }
  grid.innerHTML=list.map(g=>`
    <a class="card" href="${g.link}" target="_blank">
      <div class="card-img">
        <span class="badge">جديد</span>
        <img src="${g.image}" alt="${g.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300/151E32/0D84FF?text=IDEA+STUDIO'">
        <span class="dl">⬇️ ${g.downloads||'0'} تحميل</span>
      </div>
      <div class="card-body">
        <div class="card-title">${g.title}</div>
        <div class="pills">
          <span class="pill">${g.category||'ألعاب'}</span>
          ${(g.tags||[]).map(t=>`<span class=pill>${t}</span>`).join('')}
          <span class="pill apk">APK</span>
          <span class="pill">${g.size||''}</span>
        </div>
      </div>
    </a>
  `).join('');
}
function filter(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  const f=document.querySelector('#filters .active')?.dataset.f||'all';
  const filtered=allGames.filter(g=>{
    const t=g.title.toLowerCase(); const cat=(g.category+' '+(g.tags||[]).join(' ')).toLowerCase();
    const matchQ=!q||t.includes(q); const matchF=f=='all'||cat.includes(f.toLowerCase())||t.includes(f.toLowerCase());
    return matchQ&&matchF;
  });
  render(filtered);
}
document.getElementById('search').addEventListener('input',filter);
document.getElementById('filters').addEventListener('click',e=>{ if(e.target.tagName!='BUTTON') return; document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active')); e.target.classList.add('active'); filter(); });
loadGames();
</script>
</body>
</html>
